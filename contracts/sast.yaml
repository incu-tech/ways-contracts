apiVersion: ways/v1alpha1
kind: SlotContract
metadata:
  name: ways.dev/sast
  version: 1.0.0
  displayName: Static analysis (SAST)
  description: Static application security testing — scan first-party code for vulnerabilities.
spec:
  operations:
    - { name: scan-code, description: Scan the working tree or a diff for vulnerabilities. }
    - { name: read-findings, description: Read findings with severity and location. }
    - { name: ignore-finding, description: Record an accepted/ignored finding with a reason. }
