apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: sonarqube-sast
  version: 1.0.0
  description: Satisfy ways.dev/sast with SonarQube / SonarCloud via sonar-scanner.
spec:
  contract: ways.dev/sast@1
  impl: sonarqube
  coversOperations: [scan-code, read-findings, ignore-finding]
  requires:
    cli:
      - name: sonar-scanner
        check: sonar-scanner --version
        install: 'brew install sonar-scanner  (or the official Docker image)'
        required: true
        reason: Submits the analysis to the SonarQube server.
    env:
      - name: SONAR_TOKEN
        secret: true
        required: true
        reason: Authenticates the analysis submission.
      - name: SONAR_HOST_URL
        required: false
        reason: Self-hosted server URL; unset means SonarCloud.
