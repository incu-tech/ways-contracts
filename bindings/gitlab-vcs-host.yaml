apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: gitlab-vcs-host
  version: 1.0.0
  description: Satisfy ways.dev/vcs-host with GitLab (glab CLI).
spec:
  contract: ways.dev/vcs-host@1
  impl: gitlab
  coversOperations: [read-repo, open-pr, pin-ref]
  requires:
    cli:
      - name: glab
        check: glab auth status
        install: 'brew install glab'
        required: true
