apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: linear-issue-tracker
  version: 1.0.0
  description: Satisfy ways.dev/issue-tracker with Linear (MCP server).
spec:
  contract: ways.dev/issue-tracker@1
  impl: linear
  coversOperations: [create-issue, link-issue, read-issue]
  requires:
    mcp:
      - name: com.linear/linear
        required: true
        remotes:
          - transport: streamable-http
            url: https://mcp.linear.app/mcp
