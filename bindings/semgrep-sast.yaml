apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: semgrep-sast
  version: 1.0.0
  description: Satisfy ways.dev/sast with Semgrep. PARTIAL — no ignore-finding (Semgrep records
    suppressions as `nosem` comments in the code, not as a scanner-side operation).
spec:
  contract: ways.dev/sast@1
  impl: semgrep
  coversOperations: [scan-code, read-findings]
  requires:
    cli:
      - name: semgrep
        check: semgrep --version
        install: pipx install semgrep
        required: true
        reason: Runs the ruleset locally.
