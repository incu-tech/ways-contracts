apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: snyk-sca
  version: 1.0.0
  description: Satisfy ways.dev/sca with Snyk Open Source. Same impl as snyk-sast — one tool may
    satisfy several contracts, and each pairing is its own Binding.
spec:
  contract: ways.dev/sca@1
  impl: snyk
  coversOperations: [scan-dependencies, read-advisories, suggest-upgrade]
  requires:
    cli:
      - name: snyk
        check: snyk --version
        install: npm i -g snyk
        required: true
        reason: Runs the dependency scan.
    env:
      - name: SNYK_TOKEN
        secret: true
        required: true
        reason: Authenticates the scan against your Snyk organization.
