apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: github-issues-issue-tracker
  version: 1.0.0
  description: Satisfy ways.dev/issue-tracker with GitHub Issues via the gh CLI. Same impl family as
    github-vcs-host — one tool, two contracts, one Binding each.
spec:
  contract: ways.dev/issue-tracker@1
  impl: github-issues
  coversOperations: [create-issue, link-issue, read-issue]
  requires:
    cli:
      - name: gh
        check: gh auth status
        versionConstraint: '>=2.0.0'
        install: 'brew install gh  (https://cli.github.com)'
        required: true
        reason: '`gh issue create/develop/view` covers the three operations.'
    env:
      - name: GH_TOKEN
        required: false
        secret: true
        reason: Only needed where `gh auth login` is not available (CI).
