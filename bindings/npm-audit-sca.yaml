apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: npm-audit-sca
  version: 1.0.0
  description: Satisfy ways.dev/sca with `npm audit` — no extra tooling, npm-ecosystem only.
spec:
  contract: ways.dev/sca@1
  impl: npm-audit
  coversOperations: [scan-dependencies, read-advisories, suggest-upgrade]
  requires:
    cli:
      - name: npm
        check: npm --version
        install: 'ships with Node.js (https://nodejs.org)'
        required: true
        reason: '`npm audit` reads the lockfile; `npm audit fix` suggests the resolving version.'
