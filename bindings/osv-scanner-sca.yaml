apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: osv-scanner-sca
  version: 1.0.0
  description: Satisfy ways.dev/sca with OSV-Scanner (OSV.dev database).
spec:
  contract: ways.dev/sca@1
  impl: osv-scanner
  coversOperations: [scan-dependencies, read-advisories]
  requires:
    cli:
      - name: osv-scanner
        check: osv-scanner --version
        install: brew install osv-scanner
        required: true
        reason: Scans lockfiles against the OSV database.
