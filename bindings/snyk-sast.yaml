apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: snyk-sast
  version: 1.0.0
  description: Satisfy ways.dev/sast with Snyk Code.
spec:
  contract: ways.dev/sast@1
  impl: snyk
  coversOperations: [scan-code, read-findings, ignore-finding]
  requires:
    cli:
      - name: snyk
        check: snyk --version
        install: npm i -g snyk
        required: true
        reason: Runs the code scan.
    env:
      - name: SNYK_TOKEN
        secret: true
        required: true
        reason: Authenticates the scan against your Snyk organization.
