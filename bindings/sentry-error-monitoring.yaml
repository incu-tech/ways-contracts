apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: sentry-error-monitoring
  version: 1.0.0
  description: Satisfy error-monitoring with Sentry (MCP server).
spec:
  contract: ways.dev/error-monitoring@1
  impl: sentry
  coversOperations: [read-issues, read-event, resolve]
  requires:
    mcp:
      - name: io.sentry/sentry
        required: true
        packages:
          - registryType: npm
            identifier: '@sentry/mcp-server'
            transport: stdio
            environmentVariables:
              - { name: SENTRY_AUTH_TOKEN, isRequired: true, isSecret: true }
